name: capywake
description: A cozy capybara-themed smart alarm.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # The platform ring, behind core/engine/AlarmEngine. Only lib/data/ imports
  # it. Android exact alarms + foreground service; on iOS it keeps a silent
  # audio session alive and does NOT survive app termination.
  alarm: ^5.3.0

  # Local persistence (offline-first, no backend). Drift over raw SQLite.
  drift: ^2.32.1

  flutter:
    sdk: flutter

  # Pre-alarm reminders only — never the ring itself, which is not reliable
  # enough on iOS. Behind core/engine/NotificationService.
  flutter_local_notifications: ^21.0.0

  flutter_localizations:
    sdk: flutter

  # State management. Riverpod 3 only, no riverpod_generator.
  flutter_riverpod: ^3.3.1

  # Navigation. StatefulShellRoute for the three tabs; /settings is declared
  # outside the shell so popping it returns to the originating tab.
  go_router: ^17.2.2

  # Reads and re-encodes PNG/WebP for the art audit, the import pipeline and
  # the capture comparison. Imported by lib/design/art_audit.dart.
  image: ^4.3.0

  # Formatting + localization (numbers, dates, times, plurals via ICU).
  intl: ^0.20.2

  # @immutable for the pure-Dart domain models ported in phase 02.
  meta: ^1.16.0

  # Joins the database path in AppDatabase's lazy connection.
  path: ^1.9.1

  # Finds the writable app-support directory for the database file. A no-op in
  # tests, which open an in-memory executor via AppDatabase.forTesting.
  path_provider: ^2.1.5

  # OS permission flow behind core/permissions/PermissionService. Only
  # lib/data/ imports it.
  permission_handler: ^12.0.1

  # The accelerometer for the two motion games, behind core/motion/MotionSensor.
  # Only lib/data/ imports it. No runtime permission on either platform; iOS
  # needs NSMotionUsageDescription in Info.plist or the plugin crashes.
  sensors_plus: ^7.1.0

  # Native SQLite for device and simulator. Ships prebuilt iOS/Android
  # libraries, so it changes the pod install and the shipped binary —
  # check_bundle_size.dart measures the art budget and cannot see it.
  sqlite3_flutter_libs: ^0.5.40

  # Correct alarm scheduling across time zones and DST. The substrate the
  # schedule service and coordinator are built on.
  timezone: ^0.11.0

  # Stable ids for domain entities.
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.10.0

  # Drift codegen. Only run when the table definitions change.
  drift_dev: ^2.32.1

  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  very_good_analysis: ^9.0.0

  # Reads pubspec.yaml back in art_manifest_test.
  yaml: ^3.1.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/art/wordmark.webp
    - assets/art/scenes/
    - assets/art/tiles/
    - assets/art/mascots/
    - assets/art/games/
    - assets/art/animations/
    - assets/art/decor/
    - assets/art/thumbnails/
    - assets/art/themes/
    - assets/art/icons/

    # Generated by tool/generate_tones.dart; see assets/sounds/LICENSES.md.
    # Uncompressed 16-bit mono WAV on purpose: MP3/AAC encoder padding clicks
    # at every loop junction and loopAudio is on. The assets/ prefix is
    # load-bearing on iOS, which reads anything else as a Documents path and
    # fails silently.
    - assets/sounds/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
